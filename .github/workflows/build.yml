name: Build RootHide Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Download Theos SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$GITHUB_WORKSPACE/sdks"

      - name: Install iPhoneOS SDK
        run: |
          set -e

          SDK=$(find "$GITHUB_WORKSPACE/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDK" ]; then
            echo "Không tìm thấy iPhoneOS SDK"
            echo "Các SDK hiện có:"
            find "$GITHUB_WORKSPACE/sdks" -maxdepth 1 -type d -name "*.sdk"
            exit 1
          fi

          echo "Using SDK: $SDK"

          cp -R "$SDK" "$GITHUB_WORKSPACE/theos/sdks/"

      - name: Verify Theos
        run: |
          echo "THEOS = $GITHUB_WORKSPACE/theos"
          find "$GITHUB_WORKSPACE/theos/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

      - name: Build RootHide package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Show generated package
        run: |
          echo "=== DEB FILES ==="
          find packages -type f -name "*.deb" -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: StatusHomeBarAdjuster-RootHide
          path: packages/*.deb
          if-no-files-found: error
