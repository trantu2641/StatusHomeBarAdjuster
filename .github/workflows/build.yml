name: Build RootHide DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Clone RootHide Theos
        run: |
          set -e

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Download Theos SDK repository
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/sdks"

      - name: Install iPhoneOS SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          SDK=$(find "$GITHUB_WORKSPACE/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDK" ]; then
            echo "ERROR: No iPhoneOS SDK found"
            find "$GITHUB_WORKSPACE/sdks" -maxdepth 2 -type d -name "*.sdk"
            exit 1
          fi

          echo "Using SDK:"
          echo "$SDK"

          cp -R "$SDK" "$THEOS/sdks/"

      - name: Check Theos
        run: |
          set -e

          echo "THEOS = $THEOS"

          test -f "$THEOS/makefiles/common.mk"

          echo "Theos OK"

          echo "Available SDKs:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print

      - name: Check RootHide package scheme
        run: |
          set -e

          grep -R "roothide" "$THEOS/makefiles" \
            "$THEOS/makefiles/package" \
            2>/dev/null | head -30 || true

      - name: Build RootHide package
        run: |
          set -e

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Verify generated DEB
        run: |
          set -e

          echo "=============================="
          echo "Generated packages:"
          echo "=============================="

          find "$GITHUB_WORKSPACE/packages" \
            -type f \
            -name "*.deb" \
            -print

          DEB=$(find "$GITHUB_WORKSPACE/packages" \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No DEB generated"
            exit 1
          fi

          echo
          echo "DEB:"
          echo "$DEB"

          echo
          echo "Package information:"
          dpkg-deb -I "$DEB"

      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4
        with:
          name: StatusHomeBarAdjuster-RootHide-DEB
          path: packages/*.deb
          if-no-files-found: error
