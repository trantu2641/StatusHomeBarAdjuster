name: Build RootHide Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git $HOME/sdks
          cp -R $HOME/sdks/iPhoneOS15.2.sdk $HOME/theos/sdks/

      - name: Install RootHide support
        run: |
          git clone https://github.com/RootHide/Developer.git $HOME/roothide-developer
          if [ -d "$HOME/roothide-developer/theos" ]; then
            cp -R "$HOME/roothide-developer/theos/"* "$HOME/theos/" || true
          fi

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Show packages
        run: |
          find packages -type f -name "*.deb" -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: StatusHomeBarAdjuster-RootHide
          path: packages/*.deb
          if-no-files-found: error
