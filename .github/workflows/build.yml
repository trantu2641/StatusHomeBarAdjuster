name: Build StatusHomeBarAdjuster

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Install SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$GITHUB_WORKSPACE/sdks"

          SDK=$(find "$GITHUB_WORKSPACE/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDK" ]; then
            echo "No iPhoneOS SDK found"
            exit 1
          fi

          echo "Using SDK: $SDK"
          cp -R "$SDK" "$GITHUB_WORKSPACE/theos/sdks/"

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: List packages
        run: |
          find packages -type f -name "*.deb" -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: StatusHomeBarAdjuster
          path: packages/*.deb
          if-no-files-found: error
