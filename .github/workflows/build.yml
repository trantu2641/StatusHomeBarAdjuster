name: Build RootHide DEB

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: macos-14

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          brew install ldid


      # ==========================================
      # ROOT HIDE THEOS
      # ==========================================

      - name: Install RootHide Theos
        run: |

          set -e

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$GITHUB_WORKSPACE/theos"

          echo "THEOS=$GITHUB_WORKSPACE/theos" \
            >> "$GITHUB_ENV"


      # ==========================================
      # THEOS SDKS
      # ==========================================

      - name: Download Theos SDK repository
        run: |

          set -e

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$GITHUB_WORKSPACE/sdks"


      # ==========================================
      # INSTALL IPHONEOS SDK
      # ==========================================

      - name: Install iPhoneOS SDK
        run: |

          set -e

          mkdir -p "$THEOS/sdks"

          SDK=$(find "$GITHUB_WORKSPACE/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDK" ]; then

            echo "ERROR: iPhoneOS SDK not found."

            find "$GITHUB_WORKSPACE/sdks" \
              -maxdepth 2 \
              -type d \
              -name "*.sdk"

            exit 1

          fi

          echo "Using SDK:"
          echo "$SDK"

          cp -R "$SDK" "$THEOS/sdks/"


      # ==========================================
      # VERIFY THEOS
      # ==========================================

      - name: Verify Theos
        run: |

          set -e

          echo "THEOS:"
          echo "$THEOS"

          test -f \
            "$THEOS/makefiles/common.mk"

          echo "Theos OK."

          echo
          echo "SDKs:"

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print


      # ==========================================
      # BUILD ROOT HIDE DEB
      # ==========================================

      - name: Build RootHide package
        run: |

          set -e

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide


      # ==========================================
      # VERIFY DEB
      # ==========================================

      - name: Verify generated DEB
        run: |

          set -e

          echo
          echo "================================"
          echo "Generated DEB"
          echo "================================"

          find "$GITHUB_WORKSPACE/packages" \
            -type f \
            -name "*.deb" \
            -print

          DEB=$(find \
            "$GITHUB_WORKSPACE/packages" \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB" ]; then

            echo "ERROR: No DEB generated."

            exit 1

          fi

          echo
          echo "DEB FILE:"
          echo "$DEB"

          echo
          echo "FILE INFORMATION:"

          file "$DEB"

          echo
          echo "SIZE:"

          ls -lh "$DEB"


      # ==========================================
      # UPLOAD REAL DEB
      # ==========================================

      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4

        with:

          name: StatusHomeBarAdjuster-RootHide-DEB

          path: packages/*.deb

          if-no-files-found: error
