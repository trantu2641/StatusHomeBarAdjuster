name: Build RootHide DEB

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make ldid

      - name: Install RootHide Theos
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf \
            "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

          echo "Installed SDK:"
          ls -la "$THEOS/sdks"

      - name: Verify RootHide Theos
        run: |
          echo "THEOS = $THEOS"

          test -d "$THEOS"

          test -d "$THEOS/lib/iphone/roothide"

          echo "RootHide support detected."

          ls -la "$THEOS/lib/iphone/roothide"

      - name: Build RootHide DEB
        run: |
          set -e

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Verify DEB
        run: |
          set -e

          echo "=== Packages ==="

          find "$GITHUB_WORKSPACE/packages" \
            -type f \
            -name "*.deb" \
            -print

          DEB=$(find "$GITHUB_WORKSPACE/packages" \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: No DEB generated."
            exit 1
          fi

          echo "Generated:"
          echo "$DEB"

          echo "=== Debian information ==="

          dpkg-deb -I "$DEB" || true

      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4
        with:
          name: StatusHomeBarAdjuster-RootHide-DEB
          path: packages/*.deb
          if-no-files-found: error
